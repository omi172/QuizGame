<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Register - Quiz App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container">
    <div class="card" style="max-width:460px;margin:40px auto;">
        <h2>Create an account</h2>
        <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>
        <form class="stacked" th:action="@{/register}" th:object="${registerRequest}" method="post">
            <label for="username">Username</label>
            <input type="text" id="username" th:field="*{username}" required/>
            <p class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>

            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" required/>
            <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}" required/>
            <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

            <label for="role">Register as</label>
            <select id="role" th:field="*{role}" class="form-control">
                <option value="PARTICIPANT">Participant (take quizzes)</option>
                <option value="ADMIN">Admin (create &amp; manage quizzes)</option>
            </select>
            <p class="error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></p>

            <button class="btn" type="submit">Register</button>
        </form>
        <p style="margin-top:16px;">Already have an account? <a th:href="@{/login}">Log in</a>.</p>
    </div>
</div>
</body>
</html>
