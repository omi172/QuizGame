<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Quiz Results</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container">
    <h2 th:text="'Results: ' + ${quiz.title}">Results</h2>
    <table>
        <thead><tr><th>Participant</th><th>Score</th><th>Submitted</th></tr></thead>
        <tbody>
        <tr th:each="a : ${attempts}">
            <td th:text="${a.username}">user1</td>
            <td th:text="${a.score} + ' / ' + ${a.totalQuestions}">3 / 5</td>
            <td th:text="${a.submittedAt}">2026-07-29T10:00:00Z</td>
        </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(attempts)}">No attempts yet.</p>
    <a th:href="@{/admin/quizzes}">Back to quizzes</a>
</div>
</body>
</html>
